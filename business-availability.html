<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAGA | Availability</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
    <div class="brand"><h1>DAGA</h1><p>Business Portal</p></div>
    <nav>
        <a href="business-dashboard.html">Dashboard</a>
        <a href="business-services.html">Services</a>
        <a href="owner-bookings.html">Bookings</a>
        <a href="business-profile.html">Profile</a>
    </nav>
    <button onclick="businessLogout()">Logout</button>
</header>

<section class="extra-hero">
    <h1>Manage Availability</h1>
    <p>Set the days and timings when your business is available.</p>
</section>

<main class="extra-container">
    <div class="extra-card">
        <form id="availabilityForm">
            <h2>Available Days</h2>
            <div class="availability-days">
                <label><input type="checkbox" value="Monday"> Monday</label>
                <label><input type="checkbox" value="Tuesday"> Tuesday</label>
                <label><input type="checkbox" value="Wednesday"> Wednesday</label>
                <label><input type="checkbox" value="Thursday"> Thursday</label>
                <label><input type="checkbox" value="Friday"> Friday</label>
                <label><input type="checkbox" value="Saturday"> Saturday</label>
                <label><input type="checkbox" value="Sunday"> Sunday</label>
            </div>

            <label>Opening Time</label>
            <input type="time" id="openingTime" required>

            <label>Closing Time</label>
            <input type="time" id="closingTime" required>

            <label>Availability Note</label>
            <textarea id="availabilityNote" rows="3"
                placeholder="Enter any special availability information"></textarea>

            <button type="submit">Save Availability</button>
        </form>
        <p id="availabilityMessage"></p>
    </div>

    <div class="extra-card">
        <h2>Current Availability</h2>
        <div id="currentAvailability"></div>
    </div>
</main>

<script src="business-availability.js"></script>
</body>
</html>
