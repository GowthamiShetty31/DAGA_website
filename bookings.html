<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAGA | My Bookings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="brand">
            <h1>DAGA</h1>
            <p>Discover Around Go Again</p>
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="services.html">Services</a>
            <a href="planner.html">Trip Planner</a>
            <a href="my-trips.html">My Trips</a>
            <a href="bookings.html" class="active">Bookings</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <section class="booking-hero">
        <h2>My Bookings</h2>
        <p>View and manage your local travel experiences.</p>
    </section>

    <section class="booking-section">
        <div class="booking-heading">
            <h2>Your Booking History</h2>
            <a href="services.html" class="booking-new-btn">
                Explore Services
            </a>
        </div>

        <div class="booking-filters">
            <select id="statusFilter" onchange="filterBookings()">
                <option value="all">All Bookings</option>
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>

        <div id="bookingsContainer" class="bookings-grid"></div>
    </section>

    <footer>
        <h2>DAGA</h2>
        <p>Explore Local. Travel Better.</p>
        <p class="copyright">© 2026 DAGA. All rights reserved.</p>
    </footer>

    <script src="bookings.js"></script>
</body>
</html>
