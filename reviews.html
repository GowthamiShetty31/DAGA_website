<section class="extra-hero">
    <h1>Reviews and Ratings</h1>
    <p>Share feedback about your local tourism experience.</p>
</section>

<main class="extra-container">
    <div class="extra-card">
        <h2>Write a Review</h2>
        <form id="reviewForm">
            <label for="reviewEmail">Your booking email</label>
            <input type="email" id="reviewEmail" required>

            <label for="reviewBooking">Select an accepted booking</label>
            <select id="reviewBooking" required>
                <option value="">Enter email and load bookings</option>
            </select>
            <button type="button" onclick="loadEligibleBookings()">Load My Bookings</button>

            <label for="reviewRating">Rating</label>
            <select id="reviewRating" required>
                <option value="">Choose rating</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Very Good</option>
                <option value="3">3 - Good</option>
                <option value="2">2 - Fair</option>
                <option value="1">1 - Poor</option>
            </select>

            <label for="reviewText">Your Review</label>
            <textarea id="reviewText" rows="4" required
                placeholder="Write your experience..."></textarea>

            <button type="submit">Submit Review</button>
        </form>
        <p id="reviewMessage"></p>
    </div>

    <h2 class="extra-heading">Recent Reviews</h2>
    <div id="reviewList" class="extra-list"></div>
</main>
<script src="reviews.js"></script>
</body>
</html>
